<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Octopus</title>
  <meta name="description" content="Octopus, your personal AI assistant." />
  <meta name="theme-color" content="#0c1424" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Octopus" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/vendor/hljs-dark.css" />
  <link rel="preload" href="/vendor/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/vendor/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Sign-in and account creation -->
  <section id="login" class="login" hidden>
    <div class="login-art" aria-hidden="true"></div>
    <form id="login-form" class="login-card" novalidate>
      <div class="logo-lg" aria-hidden="true"></div>
      <h1 id="auth-title">Welcome back</h1>
      <p class="muted" id="auth-sub">Sign in to your Octopus account.</p>
      <input id="auth-name" type="text" autocomplete="name" placeholder="Your name" hidden />
      <input id="auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required />
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required />
      <input id="auth-code" type="password" autocomplete="off" placeholder="Invite code" hidden />
      <button class="btn-primary" type="submit" id="auth-submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
      <p class="auth-switch" id="auth-switch"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar glass">
      <div class="sidebar-top">
        <a class="brand" href="/" aria-label="Octopus home">
          <span class="logo-sm" aria-hidden="true"></span>
          <span class="brand-name">Octopus</span>
        </a>
        <button id="collapse" class="icon-btn" title="Close sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>

      <button id="new-chat" class="new-chat glass-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="types" role="list" aria-label="Chat types">
        <button class="nav-item type-item" data-type="chat"><svg viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l.8-4A8.5 8.5 0 1 1 7.8 19.7Z"/></svg><span>Chat</span></button>
        <button class="nav-item type-item" data-type="code"><svg viewBox="0 0 24 24"><path d="m8.5 7.5-5 4.5 5 4.5M15.5 7.5l5 4.5-5 4.5M13.5 5l-3 14"/></svg><span>Code</span></button>
        <button class="nav-item type-item" data-type="model"><svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span>Modelling</span><span class="badge">3D</span></button>
        <button class="nav-item type-item" data-type="image"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><span>Image</span></button>
      </div>
      <div class="side-sep"></div>

      <button id="nav-train" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 0-4 4v1a4 4 0 0 0-3 6.5A4 4 0 0 0 9 21h.5M12 3a4 4 0 0 1 4 4v1a4 4 0 0 1 3 6.5A4 4 0 0 1 15 21h-.5M12 3v18"/></svg>
        <span>Train Octopus</span>
        <span id="train-badge" class="badge" hidden>Training</span>
      </button>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="search" type="search" placeholder="Search chats" />
      </label>

      <nav id="history" class="history" aria-label="Chats"></nav>

      <div class="sidebar-foot">
        <button id="account-btn" class="account-btn" aria-haspopup="menu" aria-expanded="false">
          <span class="initials" id="account-initials">?</span>
          <span class="who"><b id="account-name">Account</b><small id="account-role"></small></span>
          <svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></svg>
        </button>
        <div id="account-menu" class="menu account-menu" role="menu" hidden>
          <button id="settings-btn" class="menu-row" role="menuitem">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 5.6l2.1 2.1M17.7 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.2 18.4l2.1-2.1M17.7 6.7l2.1-2.1"/></svg>
            <span>Settings</span></button>
          <button id="theme-toggle" class="menu-row" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
            <span>Appearance</span><small id="theme-label"></small></button>
          <div class="menu-sep"></div>
          <button id="logout" class="menu-row" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
            <span>Sign out</span></button>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="open-sidebar" class="icon-btn glass-btn" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg>
        </button>

        <div class="spacer"></div>
      </header>

      <section id="scroller" class="scroller">
        <div id="empty" class="empty"></div>
        <div id="thread" class="thread" aria-live="polite"></div>
        <div id="train" class="train" hidden></div>
      </section>

      <footer id="composer-wrap" class="composer-wrap">
        <form id="composer" class="composer glass">
          <div id="attachments" class="attachments"></div>
          <textarea id="input" rows="1" placeholder="Message Octopus" autocomplete="off"></textarea>
          <div class="composer-row">
            <label class="icon-btn attach" title="Attach text or code files">
              <input id="file" type="file" multiple hidden />
              <svg viewBox="0 0 24 24"><path d="m20 11.5-7.8 7.8a5 5 0 0 1-7-7l8.1-8.2a3.3 3.3 0 0 1 4.7 4.7l-8.1 8.1a1.7 1.7 0 0 1-2.4-2.4l7.5-7.4"/></svg>
            </label>
            <div id="gen-opts" class="gen-opts"></div>
            <div class="spacer"></div>
            <div class="model-picker">
              <button type="button" id="model-btn" class="model-btn" aria-haspopup="listbox" aria-expanded="false" title="Choose a model">
                <span id="model-label">Octopus</span>
                <svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
              </button>
              <div id="model-menu" class="menu up right" role="listbox" hidden></div>
            </div>
            <button id="send" class="send" type="submit" title="Send" aria-label="Send" disabled>
              <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </form>
        <p class="fineprint" id="fineprint">Octopus runs on your own computer. It can make mistakes, so check important info.</p>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast glass" role="status" hidden></div>

  <div id="preview" class="modal" hidden>
    <div class="modal-card glass">
      <div class="modal-head"><b>Preview</b><span class="muted" id="preview-note">Runs sandboxed in your browser</span>
        <button id="preview-close" class="icon-btn" aria-label="Close preview"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-pointer-lock" title="Code preview"></iframe>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script type="module" src="/vendor/model-viewer.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
